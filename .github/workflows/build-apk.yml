name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Compiler le bundle Google Play (si la clé d'envoi est configurée)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "Pas de clé d'envoi : bundle ignoré."; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew bundleRelease
      # Publication sur Google Play (canal Tests internes), seulement quand on le demande :
      # message de commit contenant [publier], ou étiquette publier-…
      - name: Publier sur Google Play (tests internes)
        if: contains(github.event.head_commit.message, '[publier]') || startsWith(github.ref, 'refs/tags/publier-')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.youbs.scenictrajets
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
      - uses: actions/upload-artifact@v4
        with:
          name: scenic-trajets-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scenic-trajets-play-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - name: Afficher le manifeste compilé (diagnostic)
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $AAPT2 dump badging app/build/outputs/apk/debug/app-debug.apk
          $AAPT2 dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk
